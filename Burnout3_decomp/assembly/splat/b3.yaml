# splat config for Burnout 3: Takedown (NTSC-U, SLUS-210.50, VER 1.00).
# Input is the raw load segment of the ELF (see tools/elf.py extract), loaded at 0x100000.
# Boundaries were recovered by hand from the merged PT_LOAD; see docs/layout.md.
# Paths below are relative to Burnout3_decomp/ (base_path).
name: Burnout 3 Takedown (SLUS-210.50)
sha1: 817cfb412af2d81d4b5fda7b57837b4e28442dfc
options:
  basename: SLUS_210.50
  target_path: orig/SLUS_210.50.rom
  elf_path: build/SLUS_210.50.elf
  base_path: ../..   # Burnout3_decomp/, relative to this file
  platform: ps2
  compiler: MWCCPS2

  gp_value: 0x004E8670

  asm_path: assembly/asm
  src_path: c_cpp/src
  build_path: build
  asset_path: assembly/assets
  generated_asm_macros_directory: assembly/include

  ld_script_path: build/SLUS_210.50.ld
  ld_dependencies: False
  ld_bss_contains_common: True

  create_asm_dependencies: False
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .ctor, .sdata, .sbss, .bss]

segments:
  - name: main
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0x19EC380
    subsegments:
      - [0x000000, asm, text]         # .text: crt0, game, RenderWare, libsce, MW runtime
      # D2 units: carved out so C can replace them (see C_UNITS in configure.py). Starts and ends
      # must be 16-byte aligned because the linker pads every input to 16 bytes.
      - [0x031AA0, asm, d2/func_00131AA0]
      - [0x031AC0, asm, text_00131AC0]
      - [0x031CE0, asm, d2/func_00131CE0]
      - [0x031D20, asm, text_00131D20]
      - [0x036E00, asm, d2/func_00136E00]
      - [0x036E10, asm, text_00136E10]
      - [0x03AE70, asm, d2/func_0013AE70]
      - [0x03AEB0, asm, text_0013AEB0]
      - [0x03B670, asm, d2/func_0013B670]
      - [0x03B6A0, asm, text_0013B6A0]
      - [0x03B740, asm, d2/func_0013B740]
      - [0x03B770, asm, text_0013B770]
      - [0x03C910, asm, d2/func_0013C910]
      - [0x03C940, asm, text_0013C940]
      - [0x04DD80, asm, d2/func_0014DD80]
      - [0x04DDB0, asm, text_0014DDB0]
      - [0x04E7E0, asm, d2/func_0014E7E0]
      - [0x04E860, asm, text_0014E860]
      - [0x04EC30, asm, d2/func_0014EC30]
      - [0x04ECB0, asm, text_0014ECB0]
      - [0x18B700, asm, d2/func_0028B700]
      - [0x18B720, asm, text_0028B720]
      - [0x369E00, textbin, vutext]   # VU microcode uploaded through DMA/VIF MPG chains
      - [0x383F00, data, data]        # .data/.rodata: libsce tags, strings, jump tables, libkernl patch blob
      - [0x3B60D0, data, d2/func_0014EC30]  # jump table of func_0014EC30 (7 entries + padding)
      - [0x3B60F0, data, data_004B60F0]
      # sinit, ctor and data_tail share the .ctor ordering bucket so the linker keeps them in this order.
      - { start: 0x3D3E00, type: asm, name: sinit, linker_section_order: .ctor }  # C++ static initializers (__sinit_*)
      - [0x3DD820, ctor, ctor]        # constructor table, null-terminated, padded to 16
      - { start: 0x3DDAA0, type: data, name: data_tail, linker_section_order: .ctor }
      - [0x3E0680, sdata, sdata]      # small data, _gp - 0x7FF0
      - { type: bss, vram: 0x004E2680, name: bss }
  - [0x3E2680]
