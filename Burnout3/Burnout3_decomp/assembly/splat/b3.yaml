# splat config for Burnout 3: Takedown (NTSC-U, SLUS-210.50, VER 1.00).
# Input is the raw load segment of the ELF (see tools/elf.py extract), loaded at 0x100000.
# Boundaries were recovered by hand from the merged PT_LOAD; see docs/layout.md.
# Paths below are relative to Burnout3_decomp/ (base_path).
name: Burnout 3 Takedown (SLUS-210.50)
sha1: 817cfb412af2d81d4b5fda7b57837b4e28442dfc
options:
  basename: SLUS_210.50
  target_path: orig/SLUS_210.50.rom
  elf_path: build/SLUS_210.50.elf
  base_path: ../..   # Burnout3_decomp/, relative to this file
  platform: ps2
  compiler: MWCCPS2
  # Library objects start on 8-byte boundaries, so input sections keep their own alignment (set per asm
  # object by configure.py) instead of being forced to 16.
  emit_subalign: False

  gp_value: 0x004E8670

  asm_path: assembly/asm
  src_path: c_cpp/src
  build_path: build
  asset_path: assembly/assets
  generated_asm_macros_directory: assembly/include

  ld_script_path: build/SLUS_210.50.ld
  ld_dependencies: False
  ld_bss_contains_common: True

  create_asm_dependencies: False
  find_file_boundaries: False
  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.txt
  reloc_addrs_path:
    - config/reloc_addrs.txt
  undefined_funcs_auto_path: build/undefined_funcs_auto.txt
  undefined_syms_auto_path: build/undefined_syms_auto.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  section_order: [.text, .data, .rodata, .ctor, .sdata, .sbss, .bss]

